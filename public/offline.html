<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#141312" />
<title>Bonvoy — Offline</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #141312;
    color: #ffffff;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .card { max-width: 340px; width: 100%; }
  .logo {
    width: 96px; height: 96px; border-radius: 24px;
    display: block; margin: 0 auto 24px;
    box-shadow: 0 12px 40px rgba(0,0,0,.55);
  }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: .2px; }
  p  { margin-top: 10px; font-size: 14px; line-height: 1.6; color: #A19E9B; }
  button {
    margin-top: 28px; border: 0; cursor: pointer;
    background: linear-gradient(95deg, #8E3D4E 0%, #A44A50 100%);
    color: #fff; font-size: 16px; font-weight: 600;
    padding: 13px 34px; border-radius: 999px;
  }
  button:active { opacity: .9; }
  .dot { color: #E4793C; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/icons/icon-192.png?v=8" alt="Bonvoy" />
    <h1>You&rsquo;re offline</h1>
    <p>Bonvoy needs an internet connection to load your trips, profile and wallet.<br />
    <span class="dot">&bull;</span> Check your connection and try again.</p>
    <button onclick="location.reload()">Try Again</button>
  </div>
  <script>
    // Auto-retry as soon as the connection comes back.
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
